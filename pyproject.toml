[project]
name = "multi-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "mypy", "pytest"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
