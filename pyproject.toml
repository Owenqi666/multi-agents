[project]
name = "multi-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[build-system]
requires = ["uv_build>=0.11.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "types-jsonschema", "types-PyYAML"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
